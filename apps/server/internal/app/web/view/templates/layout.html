<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }} · Nalanda</title>
    <style>
      /* Deliberately plain, and deliberately monochrome. The backoffice is an
         internal tool and does not follow Nalanda's design system (ADR-0026,
         decided in §C13); what it needs is to be legible in both themes without
         shipping a stylesheet and without inventing a palette that would then
         be a second design system to maintain.

         Every surface here is a tint of `currentColor`, so both themes come
         from `color-scheme` alone: there is no colour to keep in step. */
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* The bar has two halves and the shape is what matters: sections on the
         left, which WP-D onward append to, and the professor's own menu on the
         right. */
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1.5rem;
        border-block-end: 1px solid color-mix(in srgb, currentColor 30%, transparent);
      }
      .sections { display: flex; gap: 0.5rem; align-items: baseline; }
      .sections .brand { font-weight: 600; margin-inline-end: 0.75rem; }
      .sections a {
        color: inherit;
        text-decoration: none;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
      }
      .sections a:hover, .sections a:focus-visible {
        background: color-mix(in srgb, currentColor 12%, transparent);
      }

      /* <details>, not a script: the one piece of interactivity this surface
         needs is a dropdown, and the element that does it ships in every
         browser. It also keeps the "no frontend toolchain" decision from being
         renegotiated on the first page that wants a menu. */
      .menu { position: relative; }
      .menu summary {
        cursor: pointer;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
        list-style: none;
      }
      .menu summary::-webkit-details-marker { display: none; }
      .menu summary::after { content: " ▾"; }
      .menu summary:hover, .menu summary:focus-visible {
        background: color-mix(in srgb, currentColor 12%, transparent);
      }
      .menu-panel {
        position: absolute;
        inset-inline-end: 0;
        margin-block-start: 0.25rem;
        min-width: 14rem;
        padding: 0.75rem;
        /* Canvas is the system background of the ACTIVE theme, so the panel is
           opaque in both without either being named. */
        background: Canvas;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        border-radius: 0.5rem;
        z-index: 1;
      }
      .menu-panel p { margin-block: 0 0.5rem; }

      main { flex: 1; width: min(64rem, 100%); margin-inline: auto; padding: 1.5rem; }
      /* Only the pages with no bar above them — the login page for an anonymous
         visitor — which is what keeps that page looking as it did before the
         shell existed. */
      main.centered {
        width: min(28rem, 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      h1 { font-size: 1.5rem; margin-block: 0 0.5rem; }
      p { margin-block: 0 1rem; }
      .aviso, .flash {
        border-inline-start: 4px solid currentColor;
        padding: 0.5rem 0.75rem;
        margin-block-end: 1rem;
      }
      button, .boton {
        font: inherit;
        padding: 0.6rem 1rem;
        border: 1px solid currentColor;
        border-radius: 0.375rem;
        background: transparent;
        color: inherit;
        cursor: pointer;
        display: inline-block;
        text-decoration: none;
      }

      /* Lists a professor reads. Same reasoning as everything else here: no
         colour, only tints of currentColor, so both themes come from
         color-scheme alone. */
      table.lista {
        width: 100%;
        border-collapse: collapse;
        margin-block-start: 1rem;
      }
      table.lista th, table.lista td {
        text-align: start;
        padding: 0.5rem 0.75rem;
        border-block-end: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      }
      table.lista th {
        font-weight: 600;
        border-block-end-width: 2px;
      }
      table.lista tbody tr:hover {
        background: color-mix(in srgb, currentColor 8%, transparent);
      }

      /* Forms. One class, .form, with .field per row: label above input,
         error message below. currentColor-only, no width tricks — the layout
         is already narrow enough to give the form what it needs. */
      form.form { max-width: 32rem; }
      form.form .field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-block-end: 1rem;
      }
      form.form label { font-weight: 600; }
      form.form input {
        font: inherit;
        padding: 0.5rem 0.75rem;
        border: 1px solid currentColor;
        border-radius: 0.375rem;
        background: transparent;
        color: inherit;
      }
      form.form input[readonly] {
        background: color-mix(in srgb, currentColor 8%, transparent);
      }
      form.form .error {
        font-size: 0.875rem;
        border-inline-start: 3px solid currentColor;
        padding: 0.25rem 0.5rem;
      }
      form.inline {
        display: inline;
        margin-inline-start: 0.5rem;
      }
      form.inline button {
        padding: 0.25rem 0.5rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    {{ if .Professor }}
      <header class="bar">
        <nav class="sections" aria-label="Secciones">
          <span class="brand">Nalanda · administración</span>
          <a href="/professors">Profesores</a>
        </nav>
        <details class="menu">
          <summary>{{ .Professor.Email }}</summary>
          <div class="menu-panel">
            {{ if .Professor.Name }}<p>{{ .Professor.Name }}</p>{{ end }}
            <form method="post" action="/logout">
              <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}" />
              <button type="submit">Cerrar sesión</button>
            </form>
          </div>
        </details>
      </header>
    {{ end }}

    <main{{ if not .Professor }} class="centered"{{ end }}>
      {{ if .Flash }}
        <p class="flash">{{ .Flash }}</p>
      {{ end }}
      {{ template "content" . }}
    </main>
  </body>
</html>
