<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The surface colour, so a phone paints its own chrome to match instead of
         framing the page in white. One per theme since #109: a meta tag cannot
         read a CSS variable, so these two are the only literals in the product
         that restate a token. `documentShell.test.ts` compares them against
         `--nl-ground` in src/styles/index.css rather than against a hardcoded
         hex, because asserting each side alone is exactly how they drifted —
         twice. -->
    <meta name="theme-color" content="#f8f2ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <title>Nalanda</title>
    <!-- Stamps the reader's saved choice BEFORE the first paint. It has to be
         inline and it has to be here: a module runs after the document is
         painted, so a reader who chose light on a dark OS would see a dark page
         flash and then turn light, on every single navigation.

         It cannot import `lib/themePreference.ts` for the same reason, so the
         storage key is spelled twice — the only duplication of it, and the
         module names this file as its twin. `system` is deliberately absent:
         removing the attribute is what lets the stylesheet defer to
         prefers-color-scheme, so no stamp IS the system choice.

         try/catch because storage throws rather than returning null in Safari's
         private mode; an unhandled throw here happens before anything is
         painted, which is a blank page for a theme preference. -->
    <script>
      try {
        var t = localStorage.getItem('nalanda:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
