name: CI

# NOTE (latent gotcha, recorded 2026-08-06): these path filters mean docs-only
# changes run no CI. If the "web" check is ever made REQUIRED under branch
# protection, replace the filters with in-job change detection (e.g.,
# dorny/paths-filter) so the check always reports — otherwise docs-only PRs
# will wait forever on a check that never runs.

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'content/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'content/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  web:
    name: web — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
