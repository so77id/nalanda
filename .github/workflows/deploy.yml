name: Deploy cpp-runner-clang-wasm to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'experiments/cpp-runner-clang-wasm/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/cpp-runner-clang-wasm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiments/cpp-runner-clang-wasm/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build -- --base=/nalanda/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/cpp-runner-clang-wasm/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
