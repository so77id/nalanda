# Local orchestration for the Nalanda services.
#
# Lives here rather than inside an app because it coordinates services and
# belongs to none of them (docs/standards/repository-structure.md §Placement
# criteria). Each app still packages itself — the Dockerfile is in the app.
#
# `apps/server` joined with WP-C1 (#149). The two do not talk yet: the server has
# no HTTP client for the worker and does not mount `amc-work`, because that seam
# belongs to WP-E. When it arrives, the shared volume below is where they meet —
# the server writes a project into it and asks the worker to act on it, so
# nothing large crosses the HTTP boundary (docs/design/2026-08-controles.md §C9).

services:
  server:
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    image: nalanda/server:dev
    environment:
      # Every interface INSIDE the container: its network namespace is the
      # boundary, and the published port below is what decides who can reach it
      # from the host. 127.0.0.1 here would make the service unreachable even
      # from the compose network.
      NALANDA_ADDR: "0.0.0.0:8081"
      # On the volume, never in the container filesystem: the database is state
      # that must survive a rebuild (ADR-0007).
      NALANDA_DATABASE_URL: "/data/nalanda.db"
      NALANDA_LOG_LEVEL: "info"
      # Where the server is reached from OUTSIDE the container — the published
      # port below, not the bind address above. The OAuth redirect URI is built
      # from this and Google matches it character for character, so it has to be
      # the URL the browser actually visits.
      #
      # Overridable so the SAME compose file runs behind Tailscale Funnel on
      # the Jetson (#162) — `NALANDA_PUBLIC_URL=https://<host>.<tailnet>.ts.net:8443`
      # in that box's `.env`. Its scheme also flips `config.SecureCookie()`, so
      # `https://` there is what makes the session cookie carry `Secure` for the
      # first time — the piece `GOOGLE-CHECK.md` §"What this check has NOT
      # verified" defers to the first deploy. Full procedure and the exact
      # `tailscale serve`/`funnel` invocation: `infra/local/DEPLOY-JETSON.md`.
      NALANDA_PUBLIC_URL: "${NALANDA_PUBLIC_URL:-http://127.0.0.1:8081}"
      # Placeholders. The three required variables have to be present or the
      # container refuses to start, and `compose up --wait` proves the binary
      # boots — which is the whole reason this file names them. A real login
      # needs real values: put them in apps/server/.env and see GOOGLE-CHECK.md.
      NALANDA_GOOGLE_CLIENT_ID: "${NALANDA_GOOGLE_CLIENT_ID:-placeholder.apps.googleusercontent.com}"
      NALANDA_GOOGLE_CLIENT_SECRET: "${NALANDA_GOOGLE_CLIENT_SECRET:-placeholder-secret}"
      NALANDA_BOOTSTRAP_PROFESSOR_EMAIL: "${NALANDA_BOOTSTRAP_PROFESSOR_EMAIL:-}"
      # Optional, and present anyway: the four-homes rule is about the contract
      # being visible where an operator edits it, not about which variables the
      # loader would survive without.
      NALANDA_SESSION_TTL: "${NALANDA_SESSION_TTL:-720h}"
      # Off in dev on purpose: the server binds loopback and there is no proxy.
      # On the Jetson (#162) the .env carries `NALANDA_TRUST_PROXY_HEADERS=true`
      # so the sessions table records the visitor rather than 127.0.0.1 — see
      # `handler.Auth.clientIP` and `DEPLOY-JETSON.md` §"The proxy-trust
      # measurement".
      NALANDA_TRUST_PROXY_HEADERS: "${NALANDA_TRUST_PROXY_HEADERS:-false}"
      # --- WP-E (issue #166): entrance controls ---
      # The published bank (ADR-0032). Points at the JSON we bind-mount into
      # /work below — a placeholder set with zero questions, enough to boot
      # so `compose up --wait` proves the binary starts. Replace with the
      # real questions.json for actual generation:
      #   NALANDA_QUESTIONS_JSON_URL=file:///work/questions.json \
      #     cp path/to/apps/web/dist/questions.json infra/local/questions.example.json
      NALANDA_QUESTIONS_JSON_URL: "${NALANDA_QUESTIONS_JSON_URL:-file:///work/questions.json}"
      # The worker service. Same compose network, so the service name resolves.
      NALANDA_AMC_WORKER_URL: "${NALANDA_AMC_WORKER_URL:-http://amc-worker:8080}"
      # The shared volume the server and the worker BOTH mount at /work
      # (ADR-0034 §Consequences). The .tex the generator emits writes /work
      # absolute paths regardless — this only decides where the server writes.
      NALANDA_WORK_DIR: "/work"
    volumes:
      - server-data:/data
      # Shared with the amc-worker service below. The server writes a
      # control's inputs here, the worker reads them and writes the PDFs
      # back — see docs/design/2026-08-controles.md §C9.
      - amc-work:/work
      # A minimal bank file so the boot fetch succeeds. Real bank is the
      # published artifact from apps/web; this is the placeholder that lets
      # `compose up --wait` prove the binary starts.
      - ./questions.example.json:/work/questions.json:ro
    ports:
      - "127.0.0.1:8081:8081"
    # Comes back after a reboot or a Docker daemon restart. The Jetson deploy
    # (#162) reboots without a human touching it, and one of the risks its ADR
    # names is home power cuts — a container that stayed stopped after each of
    # those is silently down until someone notices. `unless-stopped` leaves
    # `docker compose stop` intact, unlike `always`.
    restart: unless-stopped
    # Free here in a way it is not for amc-worker: the image is `scratch` with
    # three files in it, and /data is the only path written. The worker's own
    # accepted residual in docs/security-notes.md prescribes exactly this pair
    # and cannot take it yet, because AMC writes all over its filesystem.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # The image is `scratch` — no shell, no curl, no wget — so a CMD-SHELL probe
    # cannot work. The binary tests itself instead: `-health` performs the same
    # check the endpoint serves and exits non-zero when the database is
    # unreachable, which is what makes `docker compose up --wait` mean something.
    healthcheck:
      test: ["CMD", "/server", "-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  amc-worker:
    build:
      context: ../../apps/amc-worker
      dockerfile: Dockerfile
    image: nalanda/amc-worker:dev
    # depends_on the server so THIS is the second container to mount the
    # shared amc-work volume. Docker seeds a named volume from the first
    # container that touches it, permissions included — and the server
    # runs as UID 65532 while the worker runs as root. Without this
    # order, root:root would seed /work and the server's first
    # os.MkdirAll under /work would fail EACCES on the first /generate.
    # The failure is invisible to `compose up --wait` because that step
    # only probes /health.
    depends_on:
      server:
        condition: service_started
    # No display, and no X socket mounted: a code path that reaches the GTK
    # interface dies here rather than silently working on a developer's machine
    # and failing on a server.
    environment:
      DISPLAY: ""
    volumes:
      - amc-work:/work
    # Bound to loopback on purpose. The worker has no authentication of its own
    # and never will: it is reachable only by `apps/server`, over the compose
    # network, and publishing it here is a convenience for driving it by hand.
    ports:
      - "127.0.0.1:8080:8080"
    # Same rationale as the server above (#162). The Jetson deploy leaves this
    # service off unless the box is asked to generate controls — the WP that
    # decides whether a 4 GB Nano can host AMC is separate from #162 — but if
    # it IS running, it should come back after a reboot for the same reason.
    restart: unless-stopped
    # The image's default command is the HTTP wrapper; the AMC CLI stays
    # available underneath for exploring by hand (`docker compose run --rm
    # amc-worker auto-multiple-choice prepare ...`).

  # The daily off-site backup, only used on the Jetson deploy (#162). Left in
  # the shared compose file rather than a prod overlay because a second file
  # is a second place to drift — the whole service is inert in dev unless the
  # AWS credentials below are present (which `.env.example` in `apps/server/`
  # leaves blank on purpose, and the profile below keeps it off the default
  # `docker compose up` path anyway).
  backup:
    build:
      context: ../deploy/jetson
      dockerfile: Dockerfile.backup
    image: nalanda/backup:dev
    # Only starts under the `jetson` profile — `docker compose up -d server`
    # will not spin this up on a developer's laptop, but on the Jetson
    # `docker compose --profile jetson up -d server backup monitor` brings
    # the three services the deploy actually runs.
    profiles: ["jetson"]
    depends_on:
      # The database file the script backs up has to exist and be reachable.
      # `service_started` rather than `service_healthy` because the FIRST
      # daily cron trigger is 03:00 UTC anyway — there is no useful race.
      server:
        condition: service_started
    volumes:
      # Read-only on purpose: SQLite's .backup holds a SHARED lock and writes
      # to the destination path in /tmp — the source itself is never mutated,
      # so the mount does not need write permission and denying it is the
      # cheapest guard against a bug that decides to `rm -f` the database.
      - server-data:/data:ro
    environment:
      # From the .env on the Jetson; the four printed by
      # `infra/deploy/jetson/provision-jetson-iam.sh` plus the two of the
      # Telegram bot. Everything is required at runtime — the script fails
      # loudly (with a Telegram notification of its own) when any is missing.
      NALANDA_S3_BUCKET: "${NALANDA_S3_BUCKET:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      # These two are shared conceptually with DocumentBuddy's — same key
      # name for the same idea — but hold DISTINCT values, because the bots
      # are distinct (the message prefix is `🧭 Nalanda`, and Miguel points
      # both bots at the same chat).
      INFRA_TELEGRAM_TOKEN: "${INFRA_TELEGRAM_TOKEN:-}"
      ALLOWED_CHAT_IDS: "${ALLOWED_CHAT_IDS:-}"
    restart: unless-stopped

  # The health monitor of #162, ADR-0037. Polls /health on the compose
  # network (not through the public Funnel — the point is to distinguish "the
  # server is down" from "the Funnel is down"), alerts after 3 consecutive
  # failures with a 30-minute cooldown, posts a recovery message when it
  # comes back. See infra/deploy/jetson/monitor.sh for the loop.
  monitor:
    build:
      context: ../deploy/jetson
      dockerfile: Dockerfile.monitor
    image: nalanda/monitor:dev
    profiles: ["jetson"]
    depends_on:
      server:
        condition: service_started
    environment:
      # Overridable so a test-restore or a bench run against a different port
      # can point this elsewhere. Defaults match this compose file's bind.
      HEALTH_URL: "${MONITOR_HEALTH_URL:-http://server:8081/health}"
      CHECK_INTERVAL: "${MONITOR_CHECK_INTERVAL:-300}"
      FAIL_THRESHOLD: "${MONITOR_FAIL_THRESHOLD:-3}"
      COOLDOWN: "${MONITOR_COOLDOWN:-1800}"
      # Same shared-name / distinct-value pair as `backup` above.
      INFRA_TELEGRAM_TOKEN: "${INFRA_TELEGRAM_TOKEN:-}"
      ALLOWED_CHAT_IDS: "${ALLOWED_CHAT_IDS:-}"
    restart: unless-stopped

volumes:
  amc-work:
  # The database file. A named volume rather than a bind mount because the
  # container runs as UID 65532 and a host directory would arrive owned by
  # whoever ran `docker compose`; Docker seeds a named volume from the image's
  # own /data, which the Dockerfile creates with the right owner.
  server-data:
