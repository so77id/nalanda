# Production overlay for the Jetson deploy (#162 S12, ADR-0038).
#
# Applied on TOP of `infra/local/docker-compose.yml` — set
# `COMPOSE_FILE=docker-compose.yml:../deploy/jetson/docker-compose.jetson.yml`
# in `infra/local/.env` on the Jetson (paths are relative to the CWD `docker
# compose` runs from, which is `infra/local/`). The `.env` on the Jetson also
# fills in the six `${…}` values referenced below.
#
# What this overlay does:
#   1. Replaces `build:` with `image: ghcr.io/so77id/nalanda-<name>:latest` on
#      the three prod services, and asks docker to `pull` rather than build.
#   2. Labels each container `com.centurylinklabs.watchtower.enable=true` so
#      the Watchtower instance running INSIDE DocumentBuddy's compose (already
#      on this Jetson) auto-updates them on every new `:latest` push. See
#      DEPLOY-JETSON.md §"Auto-update via Watchtower".
#   3. Adds the `backup` and `monitor` sidecars (they do not exist in the dev
#      compose — dev has no bucket, no bot, and no reason to poll `/health`
#      every 5 minutes).
#
# Rollback path is a plain `git revert <sha> && git push origin main`: CI
# rebuilds against the reverted code, tags `:latest`, Watchtower pulls the
# new (old) code within its poll interval. Emergency pin to a specific
# revision without a git push: `docker pull
# ghcr.io/so77id/nalanda-server:sha-<good-sha>` (plain docker — `docker
# compose pull` takes service names, not image refs), then `docker tag`
# to `:latest` and `docker compose up -d --pull=never --force-recreate
# server` (see DEPLOY-JETSON.md §Rollback for why `--pull=never` is
# load-bearing: pull_policy:always would immediately undo the pin).

services:
  server:
    # `image:` OVERRIDES the `build:` from the base file for the pull path.
    # docker compose merges: `build:` stays present but `pull_policy: always`
    # is what makes `docker compose pull` (and `docker compose up`) fetch from
    # the registry rather than rebuild locally. Do NOT pass `--build` here.
    image: ghcr.io/so77id/nalanda-server:latest
    pull_policy: always
    labels:
      # The label Watchtower's `--label-enable` looks for (see DocumentBuddy's
      # `docker-compose.prod.yml` watchtower service — same daemon, same
      # Watchtower). Present on all three prod services below.
      com.centurylinklabs.watchtower.enable: "true"

  amc-worker:
    # Not deployed on the Jetson (1.04 GB image on a 4 GB Nano is a separate
    # decision, ADR-0038 §Decision). This overlay does not touch it — Docker
    # compose keeps it defined but the Jetson never invokes it. A future WP
    # deciding to host amc-worker here adds its own overlay entry.
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  # Daily off-site backup — every field carries over from the previous compose
  # shape (S8) except `build:` becomes `image:`, and the label is added.
  backup:
    image: ghcr.io/so77id/nalanda-backup:latest
    pull_policy: always
    depends_on:
      # The database file the script backs up has to exist and be reachable.
      # `service_started` rather than `service_healthy` because the first
      # daily cron trigger is 03:00 UTC anyway — there is no useful race.
      server:
        condition: service_started
    volumes:
      # Read-only on purpose: SQLite's .backup holds a SHARED lock and writes
      # to the destination path in /tmp — the source itself is never mutated,
      # so the mount does not need write permission and denying it is the
      # cheapest guard against a bug that decides to `rm -f` the database.
      - server-data:/data:ro
    environment:
      # From the .env on the Jetson; the four printed by
      # `infra/deploy/jetson/provision-jetson-iam.sh` plus the two of the
      # Telegram bot. Every one is required at runtime — the script fails
      # loudly (with a Telegram notification of its own) when any is missing.
      NALANDA_S3_BUCKET: "${NALANDA_S3_BUCKET:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      # Same shared-name / distinct-value pair as monitor below and as the
      # CD workflow's `notify` job — same conceptual variable, distinct
      # values (Nalanda's own bot, per #162 §Design).
      INFRA_TELEGRAM_TOKEN: "${INFRA_TELEGRAM_TOKEN:-}"
      ALLOWED_CHAT_IDS: "${ALLOWED_CHAT_IDS:-}"
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Health monitor — polls the compose-network DNS name (NOT the public
  # Funnel URL: the point is to distinguish "server is down" from "Funnel is
  # down"), alerts after 3 failures, reminds every COOLDOWN.
  monitor:
    image: ghcr.io/so77id/nalanda-monitor:latest
    pull_policy: always
    depends_on:
      server:
        condition: service_started
    environment:
      HEALTH_URL: "${MONITOR_HEALTH_URL:-http://server:8081/health}"
      CHECK_INTERVAL: "${MONITOR_CHECK_INTERVAL:-300}"
      FAIL_THRESHOLD: "${MONITOR_FAIL_THRESHOLD:-3}"
      COOLDOWN: "${MONITOR_COOLDOWN:-1800}"
      INFRA_TELEGRAM_TOKEN: "${INFRA_TELEGRAM_TOKEN:-}"
      ALLOWED_CHAT_IDS: "${ALLOWED_CHAT_IDS:-}"
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
