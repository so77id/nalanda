<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" width="620" height="280" role="img" aria-label="Un arreglo lleno de capacidad cuatro recibe una inserción. Se reserva un arreglo nuevo de capacidad ocho, se copian los cuatro elementos y recién entonces se escribe el quinto. Las cuatro copias son el costo de la duplicación; las tres inserciones siguientes no copian nada.">
  <title>Duplicar la capacidad y copiar</title>
  <style>
    .panel { fill: #fdfbf9; stroke: #8e817c; stroke-width: 1; }
    .celda { fill: #ffffff; stroke: #493d37; stroke-width: 1.4; }
    .celda-libre { fill: #ffffff; stroke: #8e817c; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .celda-copia { fill: #eef4fb; stroke: #3a6ea5; stroke-width: 2; }
    .celda-nueva { fill: #eaf6ea; stroke: #2f8a2f; stroke-width: 2.4; }
    .val { fill: #2b221d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; text-anchor: middle; }
    .paso { fill: #2b221d; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .t { fill: #493d37; font-family: system-ui, sans-serif; font-size: 12.5px; }
    .tc { fill: #493d37; font-family: system-ui, sans-serif; font-size: 12.5px; text-anchor: middle; }
    .flecha { fill: none; stroke: #3a6ea5; stroke-width: 2; marker-end: url(#p4); }
  </style>
  <defs>
    <marker id="p4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6ea5"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="619" height="279" rx="8" class="panel"/>

  <text x="24" y="28" class="paso">insertLast(e) sobre un arreglo lleno</text>

  <text x="24" y="72" class="paso">Antes</text>
  <text x="24" y="90" class="t">size 4 = capacidad 4</text>
  <rect x="180" y="52" width="52" height="38" class="celda"/>
  <rect x="232" y="52" width="52" height="38" class="celda"/>
  <rect x="284" y="52" width="52" height="38" class="celda"/>
  <rect x="336" y="52" width="52" height="38" class="celda"/>
  <text x="206" y="77" class="val">a</text>
  <text x="258" y="77" class="val">b</text>
  <text x="310" y="77" class="val">c</text>
  <text x="362" y="77" class="val">d</text>
  <text x="408" y="77" class="t">no cabe uno más</text>

  <path d="M 284 96 L 284 128" class="flecha"/>
  <text x="296" y="118" class="t">reservar el doble y copiar los 4</text>

  <text x="24" y="172" class="paso">Después</text>
  <text x="24" y="190" class="t">size 5, capacidad 8</text>
  <rect x="180" y="152" width="52" height="38" class="celda-copia"/>
  <rect x="232" y="152" width="52" height="38" class="celda-copia"/>
  <rect x="284" y="152" width="52" height="38" class="celda-copia"/>
  <rect x="336" y="152" width="52" height="38" class="celda-copia"/>
  <rect x="388" y="152" width="52" height="38" class="celda-nueva"/>
  <rect x="440" y="152" width="52" height="38" class="celda-libre"/>
  <rect x="492" y="152" width="52" height="38" class="celda-libre"/>
  <rect x="544" y="152" width="52" height="38" class="celda-libre"/>
  <text x="206" y="177" class="val">a</text>
  <text x="258" y="177" class="val">b</text>
  <text x="310" y="177" class="val">c</text>
  <text x="362" y="177" class="val">d</text>
  <text x="414" y="177" class="val">e</text>

  <text x="284" y="212" class="tc">4 copias</text>
  <text x="414" y="212" class="tc">el nuevo</text>
  <text x="518" y="212" class="tc">3 libres</text>

  <text x="24" y="248" class="t">Las tres inserciones que siguen escriben y nada más: cuestan 1 cada una.</text>
  <text x="24" y="266" class="t">La copia se paga una vez y se reparte entre todas las inserciones baratas que vienen detrás.</text>
</svg>
