<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240" role="img" aria-label="Arreglo de 8 celdas con índices 0 a 7 alineados contiguamente. Una línea vertical punteada divide en mid (borde entre celdas 3 y 4). Las celdas 1 a 3 resaltadas en naranjo (parte izquierda del cruce) y las celdas 4 a 6 en verde (parte derecha del cruce). Las celdas 0 y 7 fuera del cruce están en gris. Bracket superior naranjo etiqueta 'parte izquierda' sobre las celdas 1-3; bracket verde etiqueta 'parte derecha' sobre las celdas 4-6. Abajo la ecuación suma[i..j] = suma[i..mid] + suma[mid+1..j] con anotaciones 'depende SOLO de i' y 'depende SOLO de j'.">
  <style>
    .cell        { fill: var(--color-surface, #fff); stroke: var(--color-rule, #999); stroke-width: 1; }
    .cell-cross-l { fill: var(--color-accent-soft, #ffe4d4); stroke: var(--color-accent, #d97706); stroke-width: 1.5; }
    .cell-cross-r { fill: var(--color-keep-soft, #ddf5dd); stroke: var(--color-keep, #2f8a2f); stroke-width: 1.5; }
    .val         { fill: var(--color-ink, #111); font-family: ui-monospace, monospace; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .val-muted   { fill: var(--color-ink-faint, #999); font-family: ui-monospace, monospace; font-size: 14px; text-anchor: middle; }
    .idx         { fill: var(--color-ink-faint, #666); font-family: ui-monospace, monospace; font-size: 11px; text-anchor: middle; }
    .idx-active  { fill: var(--color-accent-pop, #ea580c); font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .mid-line    { stroke: var(--color-ink-faint, #666); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .mid-lbl     { fill: var(--color-ink-faint, #666); font-family: ui-monospace, monospace; font-size: 11px; font-style: italic; text-anchor: middle; }
    .bracket-l   { stroke: var(--color-accent, #d97706); stroke-width: 2; fill: none; }
    .bracket-r   { stroke: var(--color-keep, #2f8a2f); stroke-width: 2; fill: none; }
    .lbl-l       { fill: var(--color-accent, #d97706); font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .lbl-r       { fill: var(--color-keep, #2f8a2f); font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .formula     { fill: var(--color-ink, #111); font-family: ui-monospace, monospace; font-size: 14px; text-anchor: middle; }
    .formula-lbl-l { fill: var(--color-accent, #d97706); font-family: ui-monospace, monospace; font-size: 11px; text-anchor: middle; }
    .formula-lbl-r { fill: var(--color-keep, #2f8a2f); font-family: ui-monospace, monospace; font-size: 11px; text-anchor: middle; }
    .indep-note  { fill: var(--color-ink-faint, #666); font-family: system-ui, sans-serif; font-size: 12px; font-style: italic; text-anchor: middle; }
  </style>

  <!-- 8 cells, 45px each, contiguous, starting at x=170. mid divider between cell 3 (ends 350) and cell 4 (starts 350). -->

  <!-- Brackets ABOVE the array: cells 1..3 (sufijo) — bracket span 215-350; cells 4..6 (prefijo) — bracket span 350-485 -->
  <path d="M 218 70 L 218 60 L 347 60 L 347 70" class="bracket-l"/>
  <text x="282" y="52" class="lbl-l">sufijo (termina en mid)</text>

  <path d="M 353 70 L 353 60 L 482 60 L 482 70" class="bracket-r"/>
  <text x="417" y="52" class="lbl-r">prefijo (empieza en mid+1)</text>

  <!-- Array cells contiguous -->
  <g id="array">
    <rect x="170" y="80" width="45" height="45" rx="3" class="cell"/>        <text x="192" y="107" class="val-muted">-2</text><text x="192" y="140" class="idx">0</text>
    <rect x="215" y="80" width="45" height="45" rx="3" class="cell-cross-l"/><text x="237" y="107" class="val">1</text>       <text x="237" y="140" class="idx-active">1 (i)</text>
    <rect x="260" y="80" width="45" height="45" rx="3" class="cell-cross-l"/><text x="282" y="107" class="val">-3</text>      <text x="282" y="140" class="idx">2</text>
    <rect x="305" y="80" width="45" height="45" rx="3" class="cell-cross-l"/><text x="327" y="107" class="val">4</text>       <text x="327" y="140" class="idx">3</text>
    <rect x="350" y="80" width="45" height="45" rx="3" class="cell-cross-r"/><text x="372" y="107" class="val">-1</text>      <text x="372" y="140" class="idx">4</text>
    <rect x="395" y="80" width="45" height="45" rx="3" class="cell-cross-r"/><text x="417" y="107" class="val">2</text>       <text x="417" y="140" class="idx">5</text>
    <rect x="440" y="80" width="45" height="45" rx="3" class="cell-cross-r"/><text x="462" y="107" class="val">1</text>       <text x="462" y="140" class="idx-active">6 (j)</text>
    <rect x="485" y="80" width="45" height="45" rx="3" class="cell"/>        <text x="507" y="107" class="val-muted">-5</text><text x="507" y="140" class="idx">7</text>
  </g>

  <!-- Mid divider EXACTLY between cell 3 (x=305-350) and cell 4 (x=350-395) -->
  <line x1="350" y1="75" x2="350" y2="150" class="mid-line"/>
  <text x="350" y="163" class="mid-lbl">mid</text>

  <!-- Formula below -->
  <text x="350" y="192" class="formula">suma[i..j] = suma[i..mid] + suma[mid+1..j]</text>
  <text x="230" y="210" class="formula-lbl-l">└── sufijo, depende de i ──┘</text>
  <text x="470" y="210" class="formula-lbl-r">└── prefijo, depende de j ──┘</text>
  <text x="350" y="232" class="indep-note">las dos partes son independientes — cada una se maximiza por separado</text>
</svg>
