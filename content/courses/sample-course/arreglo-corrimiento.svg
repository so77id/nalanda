<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-label="Tres estados de insertAt en la posición 2 sobre el arreglo 4, 7, 1, 3 con largo cuatro y capacidad seis. Primero el estado inicial; después el corrimiento, que copia los elementos 1 y 3 una casilla a la derecha empezando por el final y deja libre la posición 2; por último la escritura del 9 en esa posición y el largo pasa a cinco. El costo son las copias, una por cada elemento a la derecha del punto de inserción.">
  <title>Insertar en el medio: el corrimiento paso a paso</title>
  <style>
    .panel { fill: #fdfbf9; stroke: #8e817c; stroke-width: 1; }
    .celda { fill: #ffffff; stroke: #493d37; stroke-width: 1.4; }
    .celda-libre { fill: #ffffff; stroke: #8e817c; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .celda-mueve { fill: #eef4fb; stroke: #3a6ea5; stroke-width: 2; }
    .celda-nueva { fill: #eaf6ea; stroke: #2f8a2f; stroke-width: 2.4; }
    .val { fill: #2b221d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; text-anchor: middle; }
    .idx { fill: #73645c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; text-anchor: middle; }
    .paso { fill: #2b221d; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .t { fill: #493d37; font-family: system-ui, sans-serif; font-size: 12.5px; }
    .flecha { fill: none; stroke: #3a6ea5; stroke-width: 1.8; marker-end: url(#p3); }
  </style>
  <defs>
    <marker id="p3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6ea5"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="619" height="299" rx="8" class="panel"/>

  <text x="24" y="26" class="paso">insertAt(2, 9) · capacidad 6, size 4</text>

  <text x="176" y="62" class="idx">0</text>
  <text x="228" y="62" class="idx">1</text>
  <text x="280" y="62" class="idx">2</text>
  <text x="332" y="62" class="idx">3</text>
  <text x="384" y="62" class="idx">4</text>
  <text x="436" y="62" class="idx">5</text>

  <text x="24" y="94" class="paso">Inicial</text>
  <rect x="150" y="72" width="52" height="38" class="celda"/>
  <rect x="202" y="72" width="52" height="38" class="celda"/>
  <rect x="254" y="72" width="52" height="38" class="celda"/>
  <rect x="306" y="72" width="52" height="38" class="celda"/>
  <rect x="358" y="72" width="52" height="38" class="celda-libre"/>
  <rect x="410" y="72" width="52" height="38" class="celda-libre"/>
  <text x="176" y="97" class="val">4</text>
  <text x="228" y="97" class="val">7</text>
  <text x="280" y="97" class="val">1</text>
  <text x="332" y="97" class="val">3</text>
  <text x="478" y="97" class="t">size = 4</text>

  <text x="24" y="168" class="paso">Corrimiento</text>
  <text x="24" y="186" class="t">2 copias</text>
  <rect x="150" y="146" width="52" height="38" class="celda"/>
  <rect x="202" y="146" width="52" height="38" class="celda"/>
  <rect x="254" y="146" width="52" height="38" class="celda-libre"/>
  <rect x="306" y="146" width="52" height="38" class="celda-mueve"/>
  <rect x="358" y="146" width="52" height="38" class="celda-mueve"/>
  <rect x="410" y="146" width="52" height="38" class="celda-libre"/>
  <text x="176" y="171" class="val">4</text>
  <text x="228" y="171" class="val">7</text>
  <text x="332" y="171" class="val">1</text>
  <text x="384" y="171" class="val">3</text>
  <path d="M 332 142 C 340 122, 376 122, 383 140" class="flecha"/>
  <path d="M 280 142 C 288 122, 324 122, 331 140" class="flecha"/>
  <text x="478" y="171" class="t">de derecha a izquierda</text>

  <text x="24" y="248" class="paso">Escritura</text>
  <rect x="150" y="226" width="52" height="38" class="celda"/>
  <rect x="202" y="226" width="52" height="38" class="celda"/>
  <rect x="254" y="226" width="52" height="38" class="celda-nueva"/>
  <rect x="306" y="226" width="52" height="38" class="celda"/>
  <rect x="358" y="226" width="52" height="38" class="celda"/>
  <rect x="410" y="226" width="52" height="38" class="celda-libre"/>
  <text x="176" y="251" class="val">4</text>
  <text x="228" y="251" class="val">7</text>
  <text x="280" y="251" class="val">9</text>
  <text x="332" y="251" class="val">1</text>
  <text x="384" y="251" class="val">3</text>
  <text x="478" y="251" class="t">size = 5</text>

  <text x="24" y="288" class="t">El costo son size − i copias: ninguna al final (i = size), todas al principio (i = 0).</text>
</svg>
