<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" role="img" aria-label="Una tira de memoria dibujada como veintiún casillas pegadas. Ocho casillas consecutivas del medio están pintadas y rodeadas por un recuadro rotulado int de ocho, treinta y dos bytes; son el arreglo, y llevan debajo los índices 0 a 7. Las casillas de afuera, antes y después, pertenecen a otras cosas. Una flecha señala la base, la dirección de la primera casilla del arreglo.">
  <title>El arreglo alojado dentro de la memoria del proceso</title>
  <style>
    .panel { fill: #fdfbf9; stroke: #8e817c; stroke-width: 1; }
    .otra  { fill: #efeae7; stroke: #8e817c; stroke-width: 1; }
    .celda { fill: #eef4fb; stroke: #3a6ea5; stroke-width: 1.2; }
    .marco { fill: none; stroke: #3a6ea5; stroke-width: 2; }
    .tab   { fill: #fdfbf9; stroke: #3a6ea5; stroke-width: 1.2; }
    .idx   { fill: #493d37; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; text-anchor: middle; }
    .lbl   { fill: #2b221d; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .lblc  { fill: #2b221d; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .lblr  { fill: #2b221d; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: end; }
    .t     { fill: #493d37; font-family: system-ui, sans-serif; font-size: 12.5px; }
    .tr    { fill: #493d37; font-family: system-ui, sans-serif; font-size: 12.5px; text-anchor: end; }
    .flecha{ fill: none; stroke: #3a6ea5; stroke-width: 1.6; marker-end: url(#p); }
  </style>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6ea5"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="619" height="249" rx="8" class="panel"/>

  <text x="46" y="32" class="lbl">La memoria del proceso</text>

  <rect x="110" y="89" width="22" height="44" class="otra"/>
  <rect x="132" y="89" width="22" height="44" class="otra"/>
  <rect x="154" y="89" width="22" height="44" class="otra"/>
  <rect x="176" y="89" width="22" height="44" class="otra"/>
  <rect x="198" y="89" width="22" height="44" class="otra"/>
  <rect x="220" y="89" width="22" height="44" class="otra"/>
  <rect x="242" y="89" width="22" height="44" class="celda"/>
  <rect x="264" y="89" width="22" height="44" class="celda"/>
  <rect x="286" y="89" width="22" height="44" class="celda"/>
  <rect x="308" y="89" width="22" height="44" class="celda"/>
  <rect x="330" y="89" width="22" height="44" class="celda"/>
  <rect x="352" y="89" width="22" height="44" class="celda"/>
  <rect x="374" y="89" width="22" height="44" class="celda"/>
  <rect x="396" y="89" width="22" height="44" class="celda"/>
  <rect x="418" y="89" width="22" height="44" class="otra"/>
  <rect x="440" y="89" width="22" height="44" class="otra"/>
  <rect x="462" y="89" width="22" height="44" class="otra"/>
  <rect x="484" y="89" width="22" height="44" class="otra"/>
  <rect x="506" y="89" width="22" height="44" class="otra"/>
  <rect x="528" y="89" width="22" height="44" class="otra"/>
  <rect x="550" y="89" width="22" height="44" class="otra"/>

  <rect x="237" y="84" width="186" height="54" rx="4" class="marco"/>
  <rect x="237" y="51" width="186" height="24" rx="4" class="tab"/>
  <text x="330" y="68" class="lblc">int[8] data · 32 bytes</text>

  <text x="253" y="153" class="idx">0</text>
  <text x="275" y="153" class="idx">1</text>
  <text x="297" y="153" class="idx">2</text>
  <text x="319" y="153" class="idx">3</text>
  <text x="341" y="153" class="idx">4</text>
  <text x="363" y="153" class="idx">5</text>
  <text x="385" y="153" class="idx">6</text>
  <text x="407" y="153" class="idx">7</text>

  <path d="M 180 192 L 240 137" class="flecha"/>
  <text x="174" y="196" class="lblr">base</text>
  <text x="174" y="214" class="tr">la dirección de data[0]</text>

  <text x="46" y="238" class="t">Las casillas de afuera pertenecen a otras cosas: el arreglo no puede pasar de la última.</text>
</svg>
