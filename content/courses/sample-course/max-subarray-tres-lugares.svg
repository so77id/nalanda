<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="El arreglo [-2, 1, -3, 4, -1, 2, 1, -5] con tres regiones coloreadas mostrando los tres lugares posibles donde puede vivir el mejor sub-arreglo contiguo después de dividir por el medio: completamente en la mitad izquierda (índices 0 a 3), completamente en la mitad derecha (índices 4 a 7), y un tercer sub-arreglo que cruza el centro (índices 2 a 5 en el ejemplo).">
  <style>
    .cell        { fill: var(--color-surface, #fff); stroke: var(--color-rule-strong, #333); stroke-width: 1.5; }
    .cell-val    { fill: var(--color-ink, #111); font-family: ui-monospace, monospace; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .cell-idx    { fill: var(--color-ink-faint, #666); font-family: ui-monospace, monospace; font-size: 11px; text-anchor: middle; }

    .mid-line    { stroke: var(--color-ink-faint, #666); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .mid-label   { fill: var(--color-ink-faint, #666); font-family: ui-monospace, monospace; font-size: 11px; font-style: italic; text-anchor: middle; }

    .zone-izq    { fill: var(--color-accent-soft, #ffe4d4); stroke: var(--color-accent, #d97706); stroke-width: 2; }
    .zone-der    { fill: var(--color-keep-soft, #ddf5dd); stroke: var(--color-keep, #2f8a2f); stroke-width: 2; }
    .zone-cross  { fill: none; stroke: var(--color-accent-pop, #ea580c); stroke-width: 2.5; stroke-dasharray: 6 4; }

    .lbl-izq     { fill: var(--color-accent, #d97706); font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; }
    .lbl-der     { fill: var(--color-keep, #2f8a2f); font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; }
    .lbl-cross   { fill: var(--color-accent-pop, #ea580c); font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; }
  </style>

  <!-- Array cells: 8 cells, each 60px wide, starting at x=80. -->
  <g id="array">
    <!-- values: -2, 1, -3, 4, -1, 2, 1, -5 -->
    <rect x="80"  y="130" width="60" height="50" rx="4" class="cell"/>
    <text x="110" y="160" class="cell-val">-2</text>
    <text x="110" y="196" class="cell-idx">0</text>

    <rect x="140" y="130" width="60" height="50" rx="4" class="cell"/>
    <text x="170" y="160" class="cell-val">1</text>
    <text x="170" y="196" class="cell-idx">1</text>

    <rect x="200" y="130" width="60" height="50" rx="4" class="cell"/>
    <text x="230" y="160" class="cell-val">-3</text>
    <text x="230" y="196" class="cell-idx">2</text>

    <rect x="260" y="130" width="60" height="50" rx="4" class="cell"/>
    <text x="290" y="160" class="cell-val">4</text>
    <text x="290" y="196" class="cell-idx">3</text>

    <rect x="320" y="130" width="60" height="50" rx="4" class="cell"/>
    <text x="350" y="160" class="cell-val">-1</text>
    <text x="350" y="196" class="cell-idx">4</text>

    <rect x="380" y="130" width="60" height="50" rx="4" class="cell"/>
    <text x="410" y="160" class="cell-val">2</text>
    <text x="410" y="196" class="cell-idx">5</text>

    <rect x="440" y="130" width="60" height="50" rx="4" class="cell"/>
    <text x="470" y="160" class="cell-val">1</text>
    <text x="470" y="196" class="cell-idx">6</text>

    <rect x="500" y="130" width="60" height="50" rx="4" class="cell"/>
    <text x="530" y="160" class="cell-val">-5</text>
    <text x="530" y="196" class="cell-idx">7</text>
  </g>

  <!-- mid divider: between index 3 and index 4, i.e. between x=320 (end of cell 3) — actually cell 3 ends at 320, cell 4 starts at 320. Line at x=320. -->
  <line x1="320" y1="110" x2="320" y2="220" class="mid-line"/>
  <text x="320" y="105" class="mid-label">mid</text>

  <!-- Zone Izquierda (Case 1): rectangle above cells 0..3 -->
  <rect x="76" y="70" width="248" height="35" rx="6" class="zone-izq"/>
  <text x="90" y="93" class="lbl-izq">1 · Mitad izquierda</text>

  <!-- Zone Derecha (Case 2): rectangle above cells 4..7 -->
  <rect x="316" y="70" width="248" height="35" rx="6" class="zone-der"/>
  <text x="330" y="93" class="lbl-der">2 · Mitad derecha</text>

  <!-- Zone Cruza (Case 3): rectangle spanning across mid, cells 2..5 in the example -->
  <rect x="196" y="230" width="248" height="35" rx="6" class="zone-cross"/>
  <text x="210" y="253" class="lbl-cross">3 · Cruza el centro</text>

  <!-- Small "vertical" arrows connecting the cells to their zones (visual anchors) - skip for simplicity -->
</svg>
