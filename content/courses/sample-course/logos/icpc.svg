<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <!-- Same white plate as the vector logos. ICPC is not in Simple Icons, so this
       comes from the source the course author supplied — with its bottom strip
       clipped away: the original reads "IBM event sponsor", and IBM stopped
       sponsoring the ICPC in 2018 (JetBrains since). AC2 asks that everything
       the document asserts be true as of 2026-2, and a logo asserts too. -->
  <rect width="64" height="64" rx="8" fill="#ffffff"/>
  <defs>
    <clipPath id="icpc-visible"><rect x="6" y="13" width="52" height="38"/></clipPath>
  </defs>
  <g clip-path="url(#icpc-visible)">
    <image x="6" y="13" width="52" height="48.7" preserveAspectRatio="xMidYMin meet"
           href="data:image/jpeg;base64,"/>
  </g>
</svg>
