<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img" aria-label="Tres capas apiladas: el TDA fija el contrato, la estructura de datos elige la representación, y los invariantes de esa representación son de donde salen los costos. La dependencia baja de capa en capa y nunca sube.">
  <title>Contrato, representación e invariante</title>
  <style>
    .panel { fill: #fdfbf9; stroke: #8e817c; stroke-width: 1; }
    .capa { fill: #ffffff; stroke: #3a6ea5; stroke-width: 1.5; }
    .capa-inv { fill: #eef4fb; stroke: #3a6ea5; stroke-width: 1.5; }
    .t { fill: #2b221d; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; }
    .s { fill: #493d37; font-family: system-ui, sans-serif; font-size: 12.5px; }
    .n { fill: #493d37; font-family: system-ui, sans-serif; font-size: 12px; font-style: italic; }
    .flecha { fill: none; stroke: #3a6ea5; stroke-width: 2; marker-end: url(#p); }
  </style>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6ea5"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="619" height="329" rx="8" class="panel"/>

  <rect x="40" y="24" width="420" height="66" rx="6" class="capa"/>
  <text x="56" y="48" class="t">1 · TDA — el contrato</text>
  <text x="56" y="70" class="s">Qué operaciones existen y qué significan. Sequence, Comparable.</text>

  <path d="M 250 92 L 250 118" class="flecha"/>
  <text x="262" y="110" class="n">elige una</text>

  <rect x="40" y="122" width="420" height="66" rx="6" class="capa"/>
  <text x="56" y="146" class="t">2 · Estructura de datos — la representación</text>
  <text x="56" y="168" class="s">Cómo se guardan los elementos. Memoria consecutiva más un largo.</text>

  <path d="M 250 190 L 250 216" class="flecha"/>
  <text x="262" y="208" class="n">declara sus</text>

  <rect x="40" y="220" width="420" height="66" rx="6" class="capa-inv"/>
  <text x="56" y="244" class="t">3 · Invariantes — lo que se preserva</text>
  <text x="56" y="266" class="s">Los válidos son datos[0..size-1]; la capacidad acompaña al largo.</text>

  <path d="M 466 253 L 500 253" class="flecha"/>
  <text x="506" y="243" class="s">de aquí</text>
  <text x="506" y="259" class="s">salen los</text>
  <text x="506" y="275" class="s">costos</text>

  <text x="40" y="308" class="n">La dependencia baja de capa en capa: el contrato no sabe nada de los invariantes.</text>
</svg>
