<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 288" width="620" height="288" role="img" aria-label="Gráfico del costo total acumulado de sesenta y cuatro inserciones. La curva sube en escalones, con un salto en cada duplicación, y termina en 127. Queda siempre entre dos rectas punteadas: una por el número de inserciones, que sería el costo si nunca se copiara, y tres por el número de inserciones, que es la cota garantizada.">
