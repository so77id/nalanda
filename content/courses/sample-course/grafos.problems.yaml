# The Grafos unit's problem map: one source every document of the unit shows
# with <ProblemMap map="grafos" at="<its id>" /> (#356), so the five copies
# cannot drift apart. `docs` is the unit's order; `solvedIn` is the document
# where a problem is solved, and a problem without it stays open in the course.
# The keys are identifiers (English); the values are course content (Spanish).
docs:
  - grafos-representacion
  - grafos-recorridos
  - grafos-arbol-cobertor-minimo
  - grafos-caminos-mas-cortos
problems:
  - question: ¿Se puede dibujar esta figura sin levantar el lápiz?
    solvedIn: grafos-representacion
    tool: los grados (la regla de Euler)
  - question: ¿Quién tiene más seguidores?
    solvedIn: grafos-representacion
    tool: el grado de entrada
  - question: ¿A quién le sugiero como amigo?
    solvedIn: grafos-representacion
    tool: las listas de adyacencia
  - question: ¿Puedo llegar de aquí a allá?
    solvedIn: grafos-recorridos
    tool: BFS o DFS
  - question: ¿Cuántas islas hay en el mapa?
    solvedIn: grafos-recorridos
    tool: BFS o DFS
  - question: ¿Cuál es la salida del laberinto con menos pasos?
    solvedIn: grafos-recorridos
    tool: BFS
  - question: ¿En qué orden tomo los ramos, y en cuántos semestres termino?
    solvedIn: grafos-recorridos
    tool: el orden topológico
  - question: ¿Cómo conecto todas las comunas con fibra gastando lo mínimo?
    solvedIn: grafos-arbol-cobertor-minimo
    tool: Prim
  - question: ¿Cuál es la ruta más rápida de la casa a la universidad?
    solvedIn: grafos-caminos-mas-cortos
    tool: Dijkstra
  - question: ¿Y si un tramo descuenta en vez de cobrar?
    tool: Bellman-Ford
  - question: ¿La distancia entre todos los pares de ciudades a la vez?
    tool: Floyd-Warshall
  - question: ¿Cuánta agua cabe por una red de cañerías?
    tool: flujo máximo
  - question: ¿Se puede pasar por cada sala del museo una sola vez?
    tool: nadie conoce una forma rápida
  - question: ¿Cuántos días de exámenes necesito?
    tool: nadie conoce una forma rápida
  - question: ¿Cuál es el recorrido más corto por todas las ciudades?
    tool: nadie conoce una forma rápida
