<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img">
  <!-- Two library calls and what each one is inside. An earlier version drew a
       SINGLE `std::map` box opening into either structure, captioned "la misma
       llamada, dos diseños distintos" — which teaches something false: std::map
       is an ordered container by specification (a balanced tree in every
       implementation) and is never a hash table. The hash one is
       std::unordered_map, which is exactly what the prose beside the figure
       says. The drawing now says it too.
       Colours are fixed rather than inherited (an <img> never sees the page's
       currentColor) and clear 3:1 on both grounds; the two structures are also
       told apart by shape, never by colour alone. -->
  <g font-family="ui-monospace, monospace" font-size="12" fill="#6b7280">
    <rect
      x="6"
      y="26"
      width="150"
      height="34"
      rx="6"
      stroke="#6b7280"
      stroke-width="2"
      fill="none"
    />
    <text x="81" y="48" text-anchor="middle">std::map</text>
    <rect
      x="6"
      y="118"
      width="150"
      height="34"
      rx="6"
      stroke="#6b7280"
      stroke-width="2"
      fill="none"
    />
    <text x="81" y="140" text-anchor="middle">std::unordered_map</text>
  </g>
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M164 43 L196 43" />
    <path d="M164 135 L196 135" />
  </g>
  <g fill="#6b7280">
    <path d="M188 37 L196 43 L188 49 Z" />
    <path d="M188 129 L196 135 L188 141 Z" />
  </g>

  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <path d="M252 18 L224 44 M252 18 L280 44 M224 44 L210 70 M224 44 L238 70" />
  </g>
  <g fill="#3b82f6">
    <circle cx="252" cy="18" r="6" />
    <circle cx="224" cy="44" r="6" />
    <circle cx="280" cy="44" r="6" />
    <circle cx="210" cy="70" r="6" />
    <circle cx="238" cy="70" r="6" />
  </g>
  <text
    x="246"
    y="92"
    text-anchor="middle"
    fill="#3b82f6"
    font-family="system-ui, sans-serif"
    font-size="12"
  >un árbol balanceado
  </text>

  <g stroke="#ef4444" stroke-width="2" fill="none">
    <rect x="216" y="110" width="60" height="15" />
    <rect x="216" y="125" width="60" height="15" />
    <rect x="216" y="140" width="60" height="15" />
    <rect x="216" y="155" width="60" height="15" />
  </g>
  <text
    x="246"
    y="186"
    text-anchor="middle"
    fill="#ef4444"
    font-family="system-ui, sans-serif"
    font-size="12"
  >una tabla de hash
  </text>
</svg>
