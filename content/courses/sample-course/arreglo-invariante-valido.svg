<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-label="Dos arreglos con los mismos cuatro elementos. En el válido ocupan las posiciones 0 a 3, juntos desde el principio. En el inválido quedaron en las posiciones 0, 1, 2 y 5, con dos casillas vacías en el medio: recorrerlo de principio a fin devuelve basura en la posición 3 y nunca llega al cuarto elemento.">
  <title>La invariante del arreglo: elementos juntos desde la posición 0</title>
  <style>
    .panel { fill: #fdfbf9; stroke: #8e817c; stroke-width: 1; }
    .val { fill: #2b221d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; text-anchor: middle; }
    .idx { fill: #73645c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; text-anchor: middle; }
    .ok { fill: #1f6b1f; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .bad { fill: #8a1c16; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .note { fill: #493d37; font-family: system-ui, sans-serif; font-size: 12.5px; }
    .mark { fill: #b3261e; }
  </style>
  <rect x="0.5" y="0.5" width="619" height="299" rx="8" class="panel"/>
  <text x="150" y="34" class="ok">✓ VÁLIDO — los cuatro elementos, juntos desde la posición 0</text>
  <rect x="150" y="46" width="52" height="44" rx="3" fill="#ffffff" stroke="#493d37" stroke-width="1.5"/>
  <text x="176" y="75" class="val">4</text>
  <text x="176" y="106" class="idx">0</text>
  <rect x="206" y="46" width="52" height="44" rx="3" fill="#ffffff" stroke="#493d37" stroke-width="1.5"/>
  <text x="232" y="75" class="val">7</text>
  <text x="232" y="106" class="idx">1</text>
  <rect x="262" y="46" width="52" height="44" rx="3" fill="#ffffff" stroke="#493d37" stroke-width="1.5"/>
  <text x="288" y="75" class="val">1</text>
  <text x="288" y="106" class="idx">2</text>
  <rect x="318" y="46" width="52" height="44" rx="3" fill="#ffffff" stroke="#493d37" stroke-width="1.5"/>
  <text x="344" y="75" class="val">3</text>
  <text x="344" y="106" class="idx">3</text>
  <rect x="374" y="46" width="52" height="44" rx="3" fill="#ffffff" stroke="#8e817c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="400" y="106" class="idx">4</text>
  <rect x="430" y="46" width="52" height="44" rx="3" fill="#ffffff" stroke="#8e817c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="456" y="106" class="idx">5</text>
  <text x="150" y="140" class="bad">✗ INVÁLIDO — los mismos cuatro, con dos huecos en el medio</text>
  <rect x="150" y="152" width="52" height="44" rx="3" fill="#ffffff" stroke="#493d37" stroke-width="1.5"/>
  <text x="176" y="181" class="val">4</text>
  <text x="176" y="212" class="idx">0</text>
  <rect x="206" y="152" width="52" height="44" rx="3" fill="#ffffff" stroke="#493d37" stroke-width="1.5"/>
  <text x="232" y="181" class="val">7</text>
  <text x="232" y="212" class="idx">1</text>
  <rect x="262" y="152" width="52" height="44" rx="3" fill="#ffffff" stroke="#493d37" stroke-width="1.5"/>
  <text x="288" y="181" class="val">1</text>
  <text x="288" y="212" class="idx">2</text>
  <rect x="318" y="152" width="52" height="44" rx="3" fill="#ffffff" stroke="#8e817c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="344" y="212" class="idx">3</text>
  <rect x="374" y="152" width="52" height="44" rx="3" fill="#ffffff" stroke="#8e817c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="400" y="212" class="idx">4</text>
  <rect x="430" y="152" width="52" height="44" rx="3" fill="#ffffff" stroke="#493d37" stroke-width="1.5"/>
  <text x="456" y="181" class="val">3</text>
  <text x="456" y="212" class="idx">5</text>
  <path d="M 344 216 L 338 228 L 350 228 z" class="mark"/>
  <path d="M 456 216 L 450 228 L 462 228 z" class="mark"/>
  <text x="150" y="256" class="note">Recorrer de principio a fin devuelve basura en la posición 3,</text>
  <text x="150" y="276" class="note">y el elemento de la 5 nunca aparece.</text>
</svg>
