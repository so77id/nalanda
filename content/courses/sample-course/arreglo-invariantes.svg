<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" width="620" height="230" role="img" aria-label="Un arreglo de capacidad diez con largo seis. Las seis primeras casillas, de la 0 a la 5, están llenas y son los elementos válidos; las cuatro últimas, de la 6 a la 9, están reservadas pero contienen basura y nunca se leen. La capacidad abarca las diez casillas.">
  <title>Las invariantes del arreglo: válidos, basura y capacidad</title>
  <style>
    .panel { fill: #fdfbf9; stroke: #8e817c; stroke-width: 1; }
    .valida { fill: #eef4fb; stroke: #3a6ea5; stroke-width: 1.6; }
    .basura { fill: #ffffff; stroke: #8e817c; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .val { fill: #2b221d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; text-anchor: middle; }
    .val-b { fill: #73645c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; text-anchor: middle; }
    .idx { fill: #493d37; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; text-anchor: middle; }
    .lbl { fill: #2b221d; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .t { fill: #493d37; font-family: system-ui, sans-serif; font-size: 12.5px; text-anchor: middle; }
    .llave { fill: none; stroke: #493d37; stroke-width: 1.3; }
  </style>

  <rect x="0.5" y="0.5" width="619" height="229" rx="8" class="panel"/>

  <rect x="60" y="62" width="48" height="44" class="valida"/>
  <rect x="108" y="62" width="48" height="44" class="valida"/>
  <rect x="156" y="62" width="48" height="44" class="valida"/>
  <rect x="204" y="62" width="48" height="44" class="valida"/>
  <rect x="252" y="62" width="48" height="44" class="valida"/>
  <rect x="300" y="62" width="48" height="44" class="valida"/>
  <rect x="348" y="62" width="48" height="44" class="basura"/>
  <rect x="396" y="62" width="48" height="44" class="basura"/>
  <rect x="444" y="62" width="48" height="44" class="basura"/>
  <rect x="492" y="62" width="48" height="44" class="basura"/>

  <text x="84" y="90" class="val">4</text>
  <text x="132" y="90" class="val">7</text>
  <text x="180" y="90" class="val">1</text>
  <text x="228" y="90" class="val">9</text>
  <text x="276" y="90" class="val">3</text>
  <text x="324" y="90" class="val">6</text>
  <text x="372" y="90" class="val-b">?</text>
  <text x="420" y="90" class="val-b">?</text>
  <text x="468" y="90" class="val-b">?</text>
  <text x="516" y="90" class="val-b">?</text>

  <text x="84" y="124" class="idx">0</text>
  <text x="132" y="124" class="idx">1</text>
  <text x="180" y="124" class="idx">2</text>
  <text x="228" y="124" class="idx">3</text>
  <text x="276" y="124" class="idx">4</text>
  <text x="324" y="124" class="idx">5</text>
  <text x="372" y="124" class="idx">6</text>
  <text x="420" y="124" class="idx">7</text>
  <text x="468" y="124" class="idx">8</text>
  <text x="516" y="124" class="idx">9</text>

  <path d="M 60 40 L 60 30 L 540 30 L 540 40" class="llave"/>
  <text x="300" y="22" class="lbl">capacidad = data.length = 10</text>

  <path d="M 60 142 L 60 152 L 348 152 L 348 142" class="llave"/>
  <text x="204" y="170" class="lbl">size = 6 · elementos válidos</text>
  <text x="204" y="188" class="t">data[0..size-1], juntos y desde la posición 0</text>

  <path d="M 348 142 L 348 152 L 540 152 L 540 142" class="llave"/>
  <text x="444" y="170" class="lbl">basura</text>
  <text x="444" y="188" class="t">reservada, nunca se lee</text>

  <text x="300" y="216" class="t">0 ≤ size ≤ data.length · las casillas con borde punteado no pertenecen al contenedor</text>
</svg>
